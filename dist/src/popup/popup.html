<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PhishGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: 'Google Sans', Roboto, sans-serif; background: #0d0f14; color: #fff; padding: 20px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #1a6bff, #6b2fff); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .title { font-size: 16px; font-weight: 700; }
    .subtitle { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .label { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; }
    input[type="password"] { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 9px 12px; font-size: 12px; color: #fff; outline: none; }
    input[type="password"]:focus { border-color: #1a6bff; }
    input[type="password"]::placeholder { color: rgba(255,255,255,0.25); }
    button { background: #1a6bff; color: white; border: none; border-radius: 8px; padding: 9px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button:hover { background: #155ee0; }
    .status { margin-top: 10px; font-size: 12px; padding: 8px 12px; border-radius: 8px; display: none; }
    .success { display: block !important; background: rgba(61,220,132,0.12); border: 1px solid rgba(61,220,132,0.3); color: #3ddc84; }
    .error { display: block !important; background: rgba(255,59,92,0.12); border: 1px solid rgba(255,59,92,0.3); color: #ff6b85; }
    #keyRow { display: none; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
    .remove { background: transparent; color: rgba(255,255,255,0.3); border: none; padding: 2px 6px; font-size: 11px; cursor: pointer; margin-left: auto; border-radius: 4px; }
    .remove:hover { background: rgba(255,59,92,0.15); color: #ff6b85; }
    .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 16px 0; }
    .info { font-size: 11px; color: rgba(255,255,255,0.35); line-height: 1.6; }
    .footer { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 14px; }
    a { color: #63b3ed; text-decoration: none; }
  </style>
  <script type="module" crossorigin src="/assets/popup.html-IJEf06LR.js"></script>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <div>
      <div class="title">PhishGuard</div>
      <div class="subtitle">AI Phishing Detection</div>
    </div>
  </div>

  <div id="keyRow">
    <div class="dot"></div>
    <span style="font-size:12px;color:rgba(255,255,255,0.7);" id="keyText"></span>
    <button class="remove" id="removeBtn">Remove</button>
  </div>

  <div id="inputSection">
    <div class="label">OpenRouter API Key (Free — no card needed)</div>
    <div class="row">
      <input type="password" id="keyInput" placeholder="sk-or-v1-..." />
      <button id="saveBtn">Save</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="divider"></div>
  <div class="info">
    🔒 Key stored locally — emails never saved.<br>
    ✅ Free at <a href="https://openrouter.ai" target="_blank">openrouter.ai</a> — no credit card needed.
  </div>
  <div class="footer">
    <span>v0.1.0</span>
    <a href="https://openrouter.ai/keys" target="_blank">Get free key →</a>
  </div>

</body>
</html>
